name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node and pnpm come from mise.toml, so CI runs the versions the repo declares.
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      # mise-action caches the toolchain, not the package store.
      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: node --version && pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      # WebKit is for the `safari` project alone (tests/e2e/aspect.spec.ts),
      # which guards a layout behaviour Chromium does not have.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
