name: CI

on:
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node comes from mise.toml, so CI runs the version the repo declares.
      - uses: jdx/mise-action@v4

      # mise-action caches the toolchain, not the package store. setup-node's
      # `cache: npm` went away with it, so the npm cache is restored here.
      - uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - run: node --version
      - run: npm ci
      - run: npm run check
      - run: npm test
      # WebKit is for the `safari` project alone (tests/e2e/aspect.spec.ts),
      # which guards a layout behaviour Chromium does not have.
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
