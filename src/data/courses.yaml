- id: react-para-iniciantes
  title: React para Iniciantes
  url: https://www.udemy.com/course/react-para-iniciantes-free/
  tags: [React, JavaScript]
  free: true
  thumbnail: /assets/images/react_para_iniciantes.jpeg
  description: >-
    Learn React fundamentals by building a fully functional Kanban Board from
    scratch. The course walks through JSX, components, hooks, state management,
    props, conditional rendering, and event handling. By the end, you'll have a
    portfolio-ready project where you can create, update, delete, and move tasks
    across lists.

- id: ruby-on-rails-5-na-pratica
  title: Ruby on Rails 5 na Prática
  url: https://www.udemy.com/ruby-on-rails-5-na-pratica
  tags: [Ruby, Rails, Web]
  free: false
  thumbnail: /assets/images/rails_course.jpg
  description: >-
    A hands-on course covering the full lifecycle of building a web application
    with Ruby on Rails. Topics include MVC architecture, database design, model
